name: Backend CI & Security

on:
  push:
    branches:
      - main
      - backend

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # --------------------------------
  # CI: Tests + dependency scanning
  # --------------------------------
  test:
    name: Run automated tests and Dependency Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_db_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d finance_db_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_db_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.6.1

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      # DevSecOps: check dependencies for known vulnerabilities
      - name: Run dependency vulnerability scan
        run: npm audit --audit-level=high

      - name: Create database tables
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d finance_db_test \
            -f database/schema.sql

      - name: Run automated tests
        run: npm test

  # --------------------------------
  # DevSecOps: Static code analysis
  # --------------------------------
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
